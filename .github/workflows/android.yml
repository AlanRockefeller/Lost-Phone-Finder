name: Android
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease :app:exportDebugRuntimeArtifacts :app:exportReleaseRuntimeArtifacts --stacktrace
      - run: python3 tools/verify-apk-runtime.py app/build/outputs/apk/debug/app-debug.apk --runtime-artifacts app/build/reports/debug-runtime-artifacts.txt
      - run: python3 tools/verify-apk-runtime.py app/build/outputs/apk/release/app-release-unsigned.apk --runtime-artifacts app/build/reports/release-runtime-artifacts.txt
      - run: ./gradlew lintDebug lintRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
